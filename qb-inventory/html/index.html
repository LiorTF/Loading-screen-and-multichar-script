<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lior Tools — Inventory</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Main inventory overlay -->
    <div id="inv" class="hidden">
        <div class="scrim"></div>

        <div class="inv-wrap" id="invWrap">
            <!-- PLAYER -->
            <section class="panel" id="playerPanel">
                <header class="panel-head">
                    <div class="brand">
                        <img class="brand-logo" src="assets/logo.png" alt="" />
                        <div class="brand-text">
                            <span class="brand-name" data-brand-name>LIOR TOOLS</span>
                            <span class="brand-sub">INVENTORY</span>
                        </div>
                    </div>
                    <div class="weight">
                        <div class="weight-info"><span id="pWeight">0.0</span><span class="dim"> / <span id="pMax">0.0</span> kg</span></div>
                        <div class="weight-bar"><div class="weight-fill" id="pWeightFill"></div></div>
                    </div>
                </header>
                <div class="grid" id="playerGrid"></div>
            </section>

            <!-- SECONDARY -->
            <section class="panel secondary hidden" id="secPanel">
                <header class="panel-head">
                    <div class="sec-title">
                        <svg id="secIcon" viewBox="0 0 20 20"><path d="M4 8h12v8H4zM7 8V5h6v3"/></svg>
                        <span id="secLabel">Stash</span>
                    </div>
                    <div class="weight" id="secWeightWrap">
                        <div class="weight-info"><span id="sWeight">0.0</span><span class="dim"> / <span id="sMax">0.0</span> kg</span></div>
                        <div class="weight-bar"><div class="weight-fill" id="sWeightFill"></div></div>
                    </div>
                </header>
                <div class="grid" id="secGrid"></div>
            </section>
        </div>

        <div class="hint-bar">
            <span><b>Drag</b> to move</span><i></i>
            <span><b>Shift + Drag</b> to split</span><i></i>
            <span><b>Right-click</b> for options</span><i></i>
            <span><b>Double-click</b> to use / buy</span><i></i>
            <span><b>ESC</b> to close</span>
        </div>
    </div>

    <!-- Context menu -->
    <div id="ctx" class="ctx hidden"></div>

    <!-- Amount modal (split / give / drop / buy) -->
    <div id="amountScrim" class="amount-scrim hidden"></div>
    <div id="amountModal" class="amount-modal hidden">
        <div class="am-title" id="amTitle">Amount</div>
        <div class="am-row">
            <button class="am-step" data-step="-1">−</button>
            <input id="amInput" type="number" min="1" value="1" />
            <button class="am-step" data-step="1">+</button>
        </div>
        <input id="amRange" type="range" min="1" max="1" value="1" />
        <div class="am-actions">
            <button class="btn-ghost" id="amCancel">Cancel</button>
            <button class="btn-primary" id="amConfirm">Confirm</button>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip hidden"></div>

    <!-- Item-box notifications -->
    <div id="itemBoxes" class="itembox-wrap"></div>

    <!-- Standalone hotbar peek -->
    <div id="hotbarPeek" class="hotbar-peek hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
